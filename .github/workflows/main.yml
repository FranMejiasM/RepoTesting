# This is a basic workflow to help you get started with Actions   
name: QualityClouds

on:
  # Triggers the workflow on push or pull request events
  pull_request:
  
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Triggers on standard issue or PR conversation comments
  issue_comment:
    types: [created]

  # Triggers on PR code review comments (replies/inline)
  pull_request_review_comment:
    types: [created]

# Explicit permissions needed for adding reactions and comments
permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  # ---------------------------------------------------------
  # JOB 1: QUALITY CLOUDS SCAN
  # ---------------------------------------------------------
  launch_scan:
    name: Quality Clouds Scan
    # Restrict this job to PRs and manual dispatches, avoiding runs on comments
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        # Updated to v4 to fix Node 20 deprecation warning
        uses: actions/checkout@v4

      - name: Quality Clouds Scan
        uses: qualityclouds/action-full-scan@2.3.0
        with:
          mode: cloud
          token: ${{ secrets.QC_TOKEN }}
          review: true
          allIssues: true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          pr_fails_on_blockers: true
          version: testing
          url_id: 1207


  # ---------------------------------------------------------
  # JOB 2: CHATOPS COMMAND LISTENER
  # ---------------------------------------------------------
  execute_writeoff:
    name: Write-off
    # Run if it's either comment type, matches the command, and user has permissions
    if: |
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
      startsWith(github.event.comment.body, '/writeoff') &&
      (github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    
    steps:
      - name: Acknowledge command reception (Eyes emoji)
        # Updated to v8 to fix Node 20 deprecation warning
        uses: actions/github-script@v8
        with:
          script: |
            const isPRReview = context.eventName === 'pull_request_review_comment';
            
            if (isPRReview) {
              await github.rest.reactions.createForPullRequestReviewComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: context.payload.comment.id,
                content: 'eyes'
              });
            } else {
              await github.rest.reactions.createForIssueComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: context.payload.comment.id,
                content: 'eyes'
              });
            }

      - name: Resolve issue ID from parent comment when replying without ids
        # If this is a reply (pull_request_review_comment with in_reply_to_id) and the
        # command didn't include an explicit ids=..., try to pull the "Issue ID: N" line
        # out of the QC comment being replied to, so users can just reply "/writeoff reason=... desc=\"...\"".
        uses: actions/github-script@v8
        with:
          script: |
            const commentBody = context.payload.comment.body || '';
            const isPRReview = context.eventName === 'pull_request_review_comment';
            const inReplyToId = context.payload.comment.in_reply_to_id;

            core.info(`eventName=${context.eventName}`);
            core.info(`hasIds=${/\bids=/.test(commentBody)}`);
            core.info(`in_reply_to_id=${inReplyToId}`);

            if (!/\bids=/.test(commentBody) && isPRReview && inReplyToId) {
              const { data: parentComment } = await github.rest.pulls.getReviewComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: inReplyToId
              });

              core.info(`parentComment.body=${parentComment.body}`);

              const match = (parentComment.body || '').match(/Issue ID:\**\s*(\d+)/i);
              if (match) {
                core.info(`Resolved issue ID: ${match[1]}`);
                core.exportVariable('RESOLVED_ISSUE_ID', match[1]);
              } else {
                core.warning('Parent comment found but no "Issue ID: N" pattern matched inside it.');
              }
            } else if (!isPRReview) {
              core.warning('Not a pull_request_review_comment (no true reply/threading available) — ids= must be provided explicitly.');
            } else if (!inReplyToId) {
              core.warning('This is not a reply to another comment (no in_reply_to_id) — ids= must be provided explicitly.');
            }

      - name: Parse comment, validate, and execute POST
        # Map the comment body securely to an environment variable to prevent Bash quoting errors
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          # Extract variables from the env variable using regex
          # Expected format: /writeoff ids=1,2,3 reason=MY_REASON desc="My description text"
          # If ids= is omitted, fall back to the ID resolved from the parent comment (reply case).
          WROFF_ISSUES_IDS=$(echo "$COMMENT_BODY" | grep -oP 'ids=\K[^\s]+' || true)
          if [ -z "$WROFF_ISSUES_IDS" ] && [ -n "$RESOLVED_ISSUE_ID" ]; then
            WROFF_ISSUES_IDS="$RESOLVED_ISSUE_ID"
            echo "No ids= provided; using Issue ID from parent comment: $WROFF_ISSUES_IDS"
          fi
          WROFF_REASON_NAME_ID=$(echo "$COMMENT_BODY" | grep -oP 'reason=\K[^\s]+' || true)

          # Extract description ensuring we capture everything between the quotes
          WROFF_DESCRIPTION=$(echo "$COMMENT_BODY" | grep -oP 'desc="\K[^"]+' || true)
          
          # Validations
          test -n "$WROFF_ISSUES_IDS" || { echo "Error: Missing ids (comma-separated issue IDs), and none could be resolved from a parent comment reply"; exit 1; }
          test -n "$WROFF_REASON_NAME_ID" || { echo "Error: Missing reason"; exit 1; }
          test -n "$WROFF_DESCRIPTION" || { echo "Error: Missing desc (make sure to use quotes, e.g., desc=\"...\")"; exit 1; }
          
          WROFF_REASON_NAME_ID_CLEAN=$(printf '%s' "$WROFF_REASON_NAME_ID" | tr -d '[:space:]')
          test -n "$WROFF_REASON_NAME_ID_CLEAN" || { echo "Error: Missing reason after trimming"; exit 1; }

          # Convert comma-separated string to JSON array
          ISSUES_IDS_JSON=$(printf '%s' "$WROFF_ISSUES_IDS" | jq -Rc 'split(",") | map(gsub("^\\s+|\\s+$";"")) | map(select(length>0))')
          test "$ISSUES_IDS_JSON" != "[]" || { echo "Error: No valid issue IDs found"; exit 1; }
          
          # Build the JSON payload
          PAYLOAD=$(jq -n \
            --arg reasonNameId "$WROFF_REASON_NAME_ID_CLEAN" \
            --arg description "$WROFF_DESCRIPTION" \
            --argjson issuesIds "$ISSUES_IDS_JSON" \
            '{
              data: {
                scanType: "featurebranch",
                writeOffStatus: "REQUESTED",
                expirationDate: "2030-01-01",
                serviceId: 2,
                reasonNameId: $reasonNameId,
                description: $description,
                issuesIds: $issuesIds
              }
            }')
            
          # Save the PAYLOAD to a GitHub environment variable using EOF for multiline support
          echo "GENERATED_PAYLOAD<<EOF" >> $GITHUB_ENV
          echo "$PAYLOAD" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
            
          echo "Executing HTTP POST request to Quality Clouds API..."

          # Execute HTTP POST, capturing the HTTP status and body so failures are diagnosable
          HTTP_RESPONSE=$(curl -sS -w '\nHTTP_STATUS:%{http_code}' -X POST "https://api.qualityclouds.com/api/v2/bulk-write-off-by-scan-type" \
            -H "Authorization: Bearer ${{ secrets.QC_TOKEN }}" \
            -H "Accept: application/vnd.api+json" \
            -H "Content-Type: application/vnd.api+json" \
            -H "client-name: Salesforce" \
            -d "$PAYLOAD")

          HTTP_STATUS=$(printf '%s\n' "$HTTP_RESPONSE" | tail -n1 | sed -n 's/^HTTP_STATUS:\([0-9]*\)$/\1/p')
          test -n "$HTTP_STATUS" || HTTP_STATUS=000
          HTTP_BODY=$(printf '%s\n' "$HTTP_RESPONSE" | sed '$d')

          echo "API response (HTTP $HTTP_STATUS):"
          echo "$HTTP_BODY"

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "Error: Quality Clouds API returned HTTP $HTTP_STATUS"
            exit 1
          fi

      - name: Confirm successful execution with reply
        # Only run this step if the previous bash script exits successfully
        if: success()
        uses: actions/github-script@v8
        with:
          script: |
            const isPRReview = context.eventName === 'pull_request_review_comment';
            const author = context.payload.comment.user.login;
            const originalBody = context.payload.comment.body;
            
            // Read the JSON payload from the environment variable we set in the previous step
            const sentPayload = process.env.GENERATED_PAYLOAD;
            
            // Define the base response message including the JSON payload formatted as code inside a spoiler
            const responseMessage = `🚀 **Write-off requested**\nThe request has been sent to the API for the indicated IDs.\n\n<details>\n<summary>View sent payload</summary>\n\n\`\`\`json\n${sentPayload}\n\`\`\`\n</details>`;
            
            if (isPRReview) {
              // Create a true threaded reply for inline code comments
              await github.rest.pulls.createReplyForReviewComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                comment_id: context.payload.comment.id,
                body: responseMessage
              });
            } else {
              // Create a simulated reply with Markdown quotes for standard flat comments
              const quotedText = originalBody.split('\n').map(line => `> ${line}`).join('\n');
              const simulatedReplyBody = `@${author} \n${quotedText}\n\n${responseMessage}`;
              
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: simulatedReplyBody
              });
            }
